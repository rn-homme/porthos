/* ================================================================
   12. EVENT DELEGATION
   ================================================================ */
function attachEventDelegation() {
  document.getElementById('tabbar').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    currentTab = Number(btn.dataset.tab);
    renderAll();
  });

  // The row menu is position:fixed at coordinates captured when it opened, so
  // it would visually detach from its row on scroll — just close it instead.
  document.addEventListener('scroll', () => {
    if (openRowMenuTicker !== null) {
      openRowMenuTicker = null;
      openRowMenuPos = null;
      renderAll();
    }
  }, true);

  document.addEventListener('click', async e => {
    const target = e.target.closest('[data-action]');
    // Close the Portfolio row menu on any click that isn't inside it or its
    // own toggle button (that toggle handles its own open/close below).
    const isMenuClick = e.target.closest('.row-menu-wrap');
    if (openRowMenuTicker !== null && !isMenuClick) {
      openRowMenuTicker = null;
      openRowMenuPos = null;
      renderAll();
    }
    if (!target) return;
    const action = target.dataset.action;
    switch (action) {
      case 'open-dca-modal': openDcaModal(); break;
      case 'edit-dca-log': openDcaModal(target.dataset.logId); break;
      case 'delete-dca-log': deleteDcaLogEntry(target.dataset.logId); break;
      case 'confirm-dca': confirmDca(); break;
      case 'open-add-position-modal': openAddPositionModal(); break;
      case 'confirm-add-position': confirmAddPosition(); break;
      case 'modal-overlay-close': closeModal(); break;
      case 'toggle-row-menu': {
        const t = target.dataset.ticker;
        if (openRowMenuTicker === t) {
          openRowMenuTicker = null;
          openRowMenuPos = null;
        } else {
          const rect = target.getBoundingClientRect();
          openRowMenuPos = { top: rect.bottom + 4, left: Math.max(8, rect.right - 130) };
          openRowMenuTicker = t;
        }
        renderAll();
        break;
      }
      case 'open-edit-position-modal':
        openRowMenuTicker = null;
        openRowMenuPos = null;
        renderAll();
        openEditPositionModal(target.dataset.ticker);
        break;
      case 'confirm-edit-position': confirmEditPosition(target.dataset.originalTicker); break;
      case 'remove-position':
        openRowMenuTicker = null;
        openRowMenuPos = null;
        removePosition(target.dataset.ticker);
        break;
      case 'refresh-market':
        isMarketRefreshing = true;
        renderAll();
        await refreshAllMarketData();
        isMarketRefreshing = false;
        renderAll();
        break;
      case 'save-api-settings': {
        apiConfig.finnhubKey = document.getElementById('input-finnhub-key').value.trim();
        apiConfig.githubPat = document.getElementById('input-github-pat').value.trim();
        apiConfig.gistId = document.getElementById('input-gist-id').value.trim();
        apiConfig.discordWebhook = document.getElementById('input-discord-webhook').value.trim();
        saveApiConfigToStorage();
        renderBanner();
        toast('API settings saved', 'success');
        break;
      }
      case 'test-finnhub': {
        const key = document.getElementById('input-finnhub-key').value.trim();
        const resultEl = document.getElementById('test-finnhub-result');
        resultEl.textContent = 'Testing...';
        try {
          const res = await fetch('https://finnhub.io/api/v1/quote?symbol=NVDA&token=' + encodeURIComponent(key));
          const data = await res.json();
          if (!res.ok || data.c === undefined) throw new Error('Invalid response');
          resultEl.innerHTML = `<span class="text-success">✓ NVDA price: ${fmtUSD(data.c)}</span>`;
        } catch (err) {
          resultEl.innerHTML = `<span class="text-danger">✗ ${esc(err.message)}</span>`;
        }
        break;
      }
      case 'test-gist': {
        const pat = document.getElementById('input-github-pat').value.trim();
        const gistId = document.getElementById('input-gist-id').value.trim();
        const resultEl = document.getElementById('test-gist-result');
        resultEl.textContent = 'Testing...';
        try {
          const gist = await gistGet(pat, gistId);
          resultEl.innerHTML = `<span class="text-success">✓ Last modified: ${new Date(gist.updated_at).toLocaleString()}</span>`;
        } catch (err) {
          resultEl.innerHTML = `<span class="text-danger">✗ ${esc(err.message)}</span>`;
        }
        break;
      }
      case 'load-from-gist':
        await tryLoadFromGist();
        renderAll();
        break;
      case 'save-to-gist':
        await trySaveToGist();
        break;
      case 'export-json': {
        const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'porthos-backup-' + todayISO() + '.json';
        a.click();
        URL.revokeObjectURL(url);
        break;
      }
      case 'trigger-import-json':
        document.getElementById('import-json-input').click();
        break;
      case 'reset-all-data': {
        const typed = prompt('Type RESET to confirm clearing all local data:');
        if (typed !== 'RESET') { toast('Reset cancelled', 'error'); break; }
        localStorage.removeItem(LS_KEYS.apiConfig);
        localStorage.removeItem(LS_KEYS.cacheData);
        localStorage.removeItem(LS_KEYS.cachePrices);
        localStorage.removeItem(LS_KEYS.cacheFx);
        localStorage.removeItem(LS_KEYS.cacheSpy);
        localStorage.removeItem(LS_KEYS.sessionHigh);
        localStorage.removeItem(LS_KEYS.spyHistory);
        localStorage.removeItem(LS_KEYS.cacheNews);
        localStorage.removeItem(LS_KEYS.gdriveToken);
        apiConfig = { finnhubKey: '', githubPat: '', gistId: '', discordWebhook: '', googleDriveClientId: '' };
        gistConfigured = false;
        appData = {
          positions: JSON.parse(JSON.stringify(DEFAULT_POSITIONS)),
          dcaSchedule: JSON.parse(JSON.stringify(DEFAULT_DCA_SCHEDULE)),
          actionLog: [], notes: [], reviewHistory: [],
          settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS))
        };
        appData.positions.forEach(ensurePositionBase);
        recomputeAllPositionsFromLog();
        prices = {}; fx = { rate: null, ts: null, cached: false };
        spy = { price: null, prevClose: null, dayChangePct: null, dayChangeAbs: null, ts: null, cached: false };
        sessionHigh = null; lastRefresh = null;
        dcaCalcState = { budget: null, mode: 'Normal', dipTicker: null, result: null };
        dcaAllocationQueue = [];
        trimInitiateState = {};
        reviewDraft = { thesisChanged: null, thesisNotes: '', newPositions: '' };
        actionLogFilters = { tickers: [], dateFrom: '', dateTo: '', actionType: 'all', sortDir: 'desc' };
        newsState = { holdings: [], macro: [], lastRefresh: null, filter: 'all' };
        renderAll();
        toast('All data reset to defaults', 'success');
        break;
      }
      case 'calc-dca-allocation': {
        const budgetEl = document.getElementById('dca-calc-budget');
        const modeEl = document.getElementById('dca-calc-mode');
        const dipEl = document.getElementById('dca-calc-dip-ticker');
        dcaCalcState.budget = budgetEl ? (parseFloat(budgetEl.value) || 0) : dcaCalcState.budget;
        dcaCalcState.mode = modeEl ? modeEl.value : dcaCalcState.mode;
        dcaCalcState.dipTicker = dipEl ? dipEl.value : dcaCalcState.dipTicker;
        dcaCalcState.result = calculateDcaAllocation(dcaCalcState.budget, dcaCalcState.mode, dcaCalcState.dipTicker);
        renderAll();
        break;
      }
      case 'log-dca-allocation': {
        if (!dcaCalcState.result || !dcaCalcState.result.allocations.length) break;
        dcaAllocationQueue = dcaCalcState.result.allocations.slice();
        const next = dcaAllocationQueue.shift();
        openDcaModal(null, next);
        break;
      }
      case 'toggle-trim-initiate':
        trimInitiateState[target.dataset.ticker] = !trimInitiateState[target.dataset.ticker];
        renderAll();
        break;
      case 'log-rebalance-action': {
        const ticker = target.dataset.ticker;
        const sharesToBuy = parseFloat(target.dataset.shares) || 0;
        const price = parseFloat(target.dataset.price) || 0;
        const reason = target.dataset.reason || 'Rebalancing buy';
        const amountTHB = Math.abs(sharesToBuy * price * (fx.rate || 0));
        openDcaModal(null, { ticker, sharesToBuy, price, amountTHB, reason });
        break;
      }
      case 'set-thesis-changed':
        reviewDraft.thesisChanged = target.dataset.val === 'true';
        renderAll();
        break;
      case 'save-review-notes': {
        const notesEl = document.getElementById('review-thesis-notes');
        const newPosEl = document.getElementById('review-new-positions');
        if (notesEl) reviewDraft.thesisNotes = notesEl.value;
        if (newPosEl) reviewDraft.newPositions = newPosEl.value;
        appData.reviewHistory = appData.reviewHistory || [];
        appData.reviewHistory.push({
          id: genId(), timestamp: Date.now(), half: getCurrentHalfLabel(),
          thesisChanged: reviewDraft.thesisChanged, thesisNotes: reviewDraft.thesisNotes,
          newPositions: reviewDraft.newPositions
        });
        persistDataCache();
        debouncedSaveToGist();
        toast('Review notes saved', 'success');
        break;
      }
      case 'apply-log-filters': {
        const tickerSel = document.getElementById('log-filter-tickers');
        actionLogFilters.tickers = tickerSel ? Array.from(tickerSel.selectedOptions).map(o => o.value) : [];
        actionLogFilters.dateFrom = document.getElementById('log-filter-from').value;
        actionLogFilters.dateTo = document.getElementById('log-filter-to').value;
        actionLogFilters.actionType = document.getElementById('log-filter-type').value;
        renderAll();
        break;
      }
      case 'clear-log-filters':
        actionLogFilters = { tickers: [], dateFrom: '', dateTo: '', actionType: 'all', sortDir: actionLogFilters.sortDir };
        renderAll();
        break;
      case 'toggle-log-sort':
        actionLogFilters.sortDir = actionLogFilters.sortDir === 'desc' ? 'asc' : 'desc';
        renderAll();
        break;
      case 'export-log-csv': {
        const enriched = computeActionLogEnriched();
        const headers = ['Date', 'Ticker', 'Tier', 'Action Type', 'Shares', 'Price USD', 'Total USD', 'Total THB', 'Avg Cost Before', 'Avg Cost After', 'Cost Basis Delta %', 'Trigger', 'Notes'];
        const csvRows = [headers.join(',')];
        enriched.forEach(x => {
          const en = x.entry;
          const totalUSDRow = (Number(en.shares) || 0) * (Number(en.price) || 0);
          const row = [en.date, en.ticker, x.tier, x.type, en.shares, en.price, totalUSDRow.toFixed(2), en.totalTHB,
            x.avgCostBefore.toFixed(4), x.avgCostAfter.toFixed(4), x.costBasisDeltaPct === null ? '' : x.costBasisDeltaPct.toFixed(2),
            en.reason, (en.notes || '').replace(/"/g, '""')];
          csvRows.push(row.map(v => `"${String(v)}"`).join(','));
        });
        const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'porthos-action-log-' + todayISO() + '.csv';
        a.click();
        URL.revokeObjectURL(url);
        break;
      }
      case 'save-to-drive':
        await saveToGoogleDrive();
        break;
      case 'open-add-note': openAddNoteModal(); break;
      case 'confirm-add-note': confirmAddNote(); break;
      case 'delete-note': deleteNote(target.dataset.noteId); break;
      case 'refresh-news':
        isNewsRefreshing = true;
        renderAll();
        await refreshNewsData();
        isNewsRefreshing = false;
        renderAll();
        break;
      case 'filter-news':
        newsState.filter = target.dataset.filter;
        renderAll();
        break;
      case 'save-gdrive-settings':
        apiConfig.googleDriveClientId = document.getElementById('input-gdrive-client-id').value.trim();
        saveApiConfigToStorage();
        toast('Integration settings saved', 'success');
        break;
      case 'set-theme-pref': {
        const key = target.dataset.themePref;
        const value = target.dataset.value;
        themePrefs[key] = value;
        document.documentElement.setAttribute('data-' + key, value);
        localStorage.setItem(LS_KEYS.themePrefs, JSON.stringify(themePrefs));
        renderAll();
        break;
      }
    }
  });

  document.addEventListener('change', e => {
    const settingInput = e.target.closest('[data-setting]');
    if (settingInput) {
      const key = settingInput.dataset.setting;
      const isNumeric = settingInput.type === 'number';
      appData.settings[key] = isNumeric ? parseFloat(settingInput.value) || 0 : settingInput.value;
      persistDataCache();
      debouncedSaveToGist();
      if (['startDate', 'targetDate', 'cashUSD', 'cashTHB'].includes(key) && currentTab !== 8) renderAll();
      return;
    }
    const dcaInput = e.target.closest('[data-dca-year]');
    if (dcaInput) {
      appData.dcaSchedule[dcaInput.dataset.dcaYear] = parseFloat(dcaInput.value) || 0;
      persistDataCache();
      debouncedSaveToGist();
      return;
    }
    const driftInput = e.target.closest('[data-drift-tier]');
    if (driftInput) {
      appData.settings.driftThresholds[driftInput.dataset.driftTier] = parseFloat(driftInput.value) || 0;
      persistDataCache();
      debouncedSaveToGist();
      return;
    }
    const cagrInput = e.target.closest('[data-cagr-scenario]');
    if (cagrInput) {
      appData.settings.cagrScenarios[cagrInput.dataset.cagrScenario] = parseFloat(cagrInput.value) || 0;
      persistDataCache();
      debouncedSaveToGist();
      renderAll();
      return;
    }
    if (e.target.id === 'dca-calc-budget') { dcaCalcState.budget = parseFloat(e.target.value) || 0; return; }
    if (e.target.id === 'dca-calc-mode') { dcaCalcState.mode = e.target.value; dcaCalcState.result = null; renderAll(); return; }
    if (e.target.id === 'dca-calc-dip-ticker') { dcaCalcState.dipTicker = e.target.value; return; }
    if (e.target.id === 'review-thesis-notes') { reviewDraft.thesisNotes = e.target.value; return; }
    if (e.target.id === 'review-new-positions') { reviewDraft.newPositions = e.target.value; return; }
    if (e.target.id === 'import-json-input') {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          appData.positions = parsed.positions || [];
          appData.dcaSchedule = parsed.dcaSchedule || JSON.parse(JSON.stringify(DEFAULT_DCA_SCHEDULE));
          appData.actionLog = parsed.actionLog || [];
          appData.notes = parsed.notes || [];
          appData.reviewHistory = parsed.reviewHistory || [];
          appData.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), parsed.settings || {});
          appData.positions.forEach(ensurePositionBase);
          ensureLogIds();
          recomputeAllPositionsFromLog();
          persistDataCache();
          renderAll();
          toast('Backup imported — click "Save to Gist" to persist remotely', 'success');
        } catch (err) {
          toast('Import failed: invalid JSON file', 'error');
        }
      };
      reader.readAsText(file);
    }
  });
}

/* ================================================================
   13. INIT
   ================================================================ */
async function init() {
  loadApiConfigFromStorage();
  loadCacheFromStorage();
  loadNewsCache();
  attachEventDelegation();
  renderAll(); // paint immediately with cached/default data (works offline)

  await tryLoadFromGist(true);
  if (appData.positions.length === 0) {
    appData.positions = JSON.parse(JSON.stringify(DEFAULT_POSITIONS));
    appData.positions.forEach(ensurePositionBase);
    recomputeAllPositionsFromLog();
    persistDataCache();
  }
  renderAll();

  await refreshAllMarketData(); // fx, spy, prices — each independently try/catch-guarded
}

document.addEventListener('DOMContentLoaded', init);
</script>
