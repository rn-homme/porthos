<!-- PORTHOS v1.0 — Phase 1 — Dashboard, Portfolio, Settings -->
<!-- PORTHOS v2.0 — Phase 2 — DCA Log, Rebalancing, Action Log, Projection, Market News -->
<!-- PORTHOS v2.1 — Buy planner, projection charts, editable CAGR, S&P 500 tracking, minimal icons -->
<!DOCTYPE html>
<html lang="en" data-theme="dark" data-neutral="cool" data-primary="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTHOS — Portfolio Orchestration &amp; Rebalancing Tool</title>
<script>
// Applied synchronously, before CSS paints, so a stored theme preference
// never flashes the default first. Sets the attributes unconditionally
// (rather than relying on the static <html data-theme="dark" ...> markup)
// so theming still works correctly if this markup is ever embedded as a
// fragment inside another page's own <html> element.
(function () {
  var root = document.documentElement;
  var prefs = { theme: 'dark', neutral: 'cool', primary: 'indigo' };
  try {
    var raw = localStorage.getItem('porthos_theme_prefs');
    if (raw) prefs = Object.assign(prefs, JSON.parse(raw));
  } catch (e) { /* ignore corrupt storage, keep defaults */ }
  root.setAttribute('data-theme', prefs.theme);
  root.setAttribute('data-neutral', prefs.neutral);
  root.setAttribute('data-primary', prefs.primary);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COLOR TOKENS — "Indigo Ledger" (multi-tone edition)
   Verbatim from the supplied token file. Pick a neutral tone + a
   primary family independently via data-theme / data-neutral /
   data-primary on <html> (see Settings → Appearance).
   ============================================================ */
:root {
  /* Neutrals — warm (beige-tinted) */
  --neutral-warm-0:   #FDFCFB;
  --neutral-warm-50:  #F7F5F2;
  --neutral-warm-100: #EFEBE6;
  --neutral-warm-200: #E2DCD4;
  --neutral-warm-300: #CFC6BA;
  --neutral-warm-400: #ADA192;
  --neutral-warm-500: #8A7D6E;
  --neutral-warm-600: #6B5F52;
  --neutral-warm-700: #504639;
  --neutral-warm-800: #362E25;
  --neutral-warm-900: #211B15;
  --neutral-warm-950: #1E1B18;

  /* Neutrals — cool (blue-tinted) */
  --neutral-cool-0:   #FCFCFD;
  --neutral-cool-50:  #F5F6F8;
  --neutral-cool-100: #EBEDF1;
  --neutral-cool-200: #DBDFE6;
  --neutral-cool-300: #C2C8D2;
  --neutral-cool-400: #9CA3B0;
  --neutral-cool-500: #7A8190;
  --neutral-cool-600: #5F6673;
  --neutral-cool-700: #464C57;
  --neutral-cool-800: #2E323A;
  --neutral-cool-900: #1B1E23;
  --neutral-cool-950: #121417;

  /* Primary — Indigo (deep navy) */
  --indigo-100: #D7DEEC; --indigo-200: #AFC0D9; --indigo-300: #8098BF;
  --indigo-400: #56719F; --indigo-500: #35507D; --indigo-600: #253C63;
  --indigo-700: #1C2E4E; --indigo-800: #16233C; --indigo-900: #0F182A;

  /* Primary — Clay (Anthropic-inspired burnt terracotta) */
  --clay-100: #F5DDCE; --clay-200: #E9BB9E; --clay-300: #DE9E78;
  --clay-400: #C97A4F; --clay-500: #B35F38; --clay-600: #954B2C;
  --clay-700: #7A3C23; --clay-800: #5E2E1B; --clay-900: #401F12;

  /* Primary — Forest (deep, elegant green) */
  --forest-100: #D6E3D7; --forest-200: #AFC8B2; --forest-300: #83A888;
  --forest-400: #5C8862; --forest-500: #436B49; --forest-600: #345439;
  --forest-700: #2A422F; --forest-800: #203424; --forest-900: #16241A;

  /* Primary — Burgundy (rich wine) */
  --burgundy-100: #EAD3D6; --burgundy-200: #D2A3AA; --burgundy-300: #B87179;
  --burgundy-400: #9C4A54; --burgundy-500: #7E3540; --burgundy-600: #642A33;
  --burgundy-700: #4E212A; --burgundy-800: #391720; --burgundy-900: #250F15;

  /* Primary — Slate Teal (cool, quiet alternative) */
  --slate-100: #D2E2E2; --slate-200: #A6C5C5; --slate-300: #78A5A5;
  --slate-400: #518686; --slate-500: #3B6B6B; --slate-600: #2E5555;
  --slate-700: #234040; --slate-800: #1A2F2F; --slate-900: #111F1F;

  /* Semantic hues (unaffected by neutral/primary choice) */
  --success-500: #3F7A5C;
  --warning-500: #C08A34;
  --error-500:   #B3483F;
  --info-500:    #3E7C7C;
}

/* NEUTRAL TONE × THEME — drives surfaces, borders, text */
:root[data-neutral="warm"][data-theme="light"],
:root:not([data-neutral])[data-theme="light"] {
  --bg-canvas: var(--neutral-warm-0); --bg-surface: var(--neutral-warm-50); --bg-surface-raised: #FFFFFF;
  --border-subtle: var(--neutral-warm-200); --border-default: var(--neutral-warm-300);
  --text-primary: var(--neutral-warm-900); --text-secondary: var(--neutral-warm-700); --text-muted: var(--neutral-warm-500);
  --text-on-primary: var(--neutral-warm-0);
  color-scheme: light;
}
:root[data-neutral="warm"][data-theme="dark"] {
  --bg-canvas: var(--neutral-warm-950); --bg-surface: var(--neutral-warm-900); --bg-surface-raised: #2A241C;
  --border-subtle: var(--neutral-warm-800); --border-default: var(--neutral-warm-700);
  --text-primary: var(--neutral-warm-50); --text-secondary: var(--neutral-warm-300); --text-muted: var(--neutral-warm-500);
  --text-on-primary: var(--neutral-warm-0);
  color-scheme: dark;
}
:root[data-neutral="cool"][data-theme="light"] {
  --bg-canvas: var(--neutral-cool-0); --bg-surface: var(--neutral-cool-50); --bg-surface-raised: #FFFFFF;
  --border-subtle: var(--neutral-cool-200); --border-default: var(--neutral-cool-300);
  --text-primary: var(--neutral-cool-900); --text-secondary: var(--neutral-cool-700); --text-muted: var(--neutral-cool-500);
  --text-on-primary: var(--neutral-cool-0);
  color-scheme: light;
}
:root[data-neutral="cool"][data-theme="dark"],
:root:not([data-neutral])[data-theme="dark"],
:root:not([data-neutral]):not([data-theme]) {
  --bg-canvas: var(--neutral-cool-950); --bg-surface: var(--neutral-cool-900); --bg-surface-raised: #232830;
  --border-subtle: var(--neutral-cool-800); --border-default: var(--neutral-cool-700);
  --text-primary: var(--neutral-cool-50); --text-secondary: var(--neutral-cool-300); --text-muted: var(--neutral-cool-500);
  --text-on-primary: var(--neutral-cool-0);
  color-scheme: dark;
}

/* PRIMARY FAMILY × THEME — drives --color-primary and its states */
:root[data-primary="indigo"][data-theme="light"],
:root:not([data-primary])[data-theme="light"] {
  --color-primary: var(--indigo-700); --color-primary-hover: var(--indigo-800); --color-primary-active: var(--indigo-900);
  --color-primary-subtle: var(--indigo-100); --color-primary-subtle-fg: var(--indigo-700);
}
:root[data-primary="indigo"][data-theme="dark"],
:root:not([data-primary])[data-theme="dark"],
:root:not([data-primary]):not([data-theme]) {
  --color-primary: var(--indigo-300); --color-primary-hover: var(--indigo-200); --color-primary-active: var(--indigo-400);
  --color-primary-subtle: var(--indigo-900); --color-primary-subtle-fg: var(--indigo-200);
}

:root[data-primary="clay"][data-theme="light"] {
  --color-primary: var(--clay-500); --color-primary-hover: var(--clay-600); --color-primary-active: var(--clay-700);
  --color-primary-subtle: var(--clay-100); --color-primary-subtle-fg: var(--clay-700);
}
:root[data-primary="clay"][data-theme="dark"] {
  --color-primary: var(--clay-300); --color-primary-hover: var(--clay-200); --color-primary-active: var(--clay-400);
  --color-primary-subtle: var(--clay-900); --color-primary-subtle-fg: var(--clay-200);
}

:root[data-primary="forest"][data-theme="light"] {
  --color-primary: var(--forest-500); --color-primary-hover: var(--forest-600); --color-primary-active: var(--forest-700);
  --color-primary-subtle: var(--forest-100); --color-primary-subtle-fg: var(--forest-700);
}
:root[data-primary="forest"][data-theme="dark"] {
  --color-primary: var(--forest-300); --color-primary-hover: var(--forest-200); --color-primary-active: var(--forest-400);
  --color-primary-subtle: var(--forest-900); --color-primary-subtle-fg: var(--forest-200);
}

:root[data-primary="burgundy"][data-theme="light"] {
  --color-primary: var(--burgundy-500); --color-primary-hover: var(--burgundy-600); --color-primary-active: var(--burgundy-700);
  --color-primary-subtle: var(--burgundy-100); --color-primary-subtle-fg: var(--burgundy-700);
}
:root[data-primary="burgundy"][data-theme="dark"] {
  --color-primary: var(--burgundy-300); --color-primary-hover: var(--burgundy-200); --color-primary-active: var(--burgundy-400);
  --color-primary-subtle: var(--burgundy-900); --color-primary-subtle-fg: var(--burgundy-200);
}

:root[data-primary="slate"][data-theme="light"] {
  --color-primary: var(--slate-500); --color-primary-hover: var(--slate-600); --color-primary-active: var(--slate-700);
  --color-primary-subtle: var(--slate-100); --color-primary-subtle-fg: var(--slate-700);
}
:root[data-primary="slate"][data-theme="dark"] {
  --color-primary: var(--slate-300); --color-primary-hover: var(--slate-200); --color-primary-active: var(--slate-400);
  --color-primary-subtle: var(--slate-900); --color-primary-subtle-fg: var(--slate-200);
}

/* SEMANTIC (success / warning / error / info) × THEME — independent of neutral/primary */
:root[data-theme="light"],
:root:not([data-theme]) {
  --color-success: #3F7A5C; --color-success-subtle: #E9F3EE; --color-success-fg: #2B5942;
  --color-warning: #C08A34; --color-warning-subtle: #FBF1E1; --color-warning-fg: #8A5F1F;
  --color-error:   #B3483F; --color-error-subtle:   #FAEBE9; --color-error-fg:   #86322B;
  --color-info:    #3E7C7C; --color-info-subtle:    #E9F3F3; --color-info-fg:    #2C5A5A;
}
:root[data-theme="dark"] {
  --color-success: #6FAE8C; --color-success-subtle: #1C2E24; --color-success-fg: #9FCBB2;
  --color-warning: #D9A662; --color-warning-subtle: #2E2313; --color-warning-fg: #E6C08C;
  --color-error:   #D4756B; --color-error-subtle:   #2E1B18; --color-error-fg:   #E6A199;
  --color-info:    #6FADAD; --color-info-subtle:    #1C2C2C; --color-info-fg:    #9FCFCF;
}

/* ============================================================
   PORTHOS APP TOKENS — mapped onto the color tokens above.
   Every component rule below consumes only these, so switching
   data-theme / data-neutral / data-primary re-themes the whole
   app without any JS re-render.
   ============================================================ */
:root{
  --bg: var(--bg-canvas);
  --card: var(--bg-surface);
  --card-raised: var(--bg-surface-raised);
  --card-border: var(--border-subtle);
  --accent: var(--color-primary);
  --success: var(--color-success);
  --warning: var(--color-warning);
  --danger: var(--color-error);
  --text: var(--text-primary);
  /* --text-secondary / --text-muted already defined above with matching names */
}
/* Solid high-emphasis fills (primary buttons, accent badges) need a shade that
   still contrasts with --text-on-primary. In dark themes --color-primary is a
   light tint meant for foreground/accent use, not a solid fill, so we fall
   back to the darker "active" stop there; light themes can use the base
   primary directly. See PR notes for the one family (clay/forest/slate dark)
   where even --color-primary-active is a borderline AA contrast — an
   inherent gap in the supplied token set for this specific use, not a bug. */
:root[data-theme="light"],
:root:not([data-theme]) {
  --accent-solid: var(--color-primary);
}
:root[data-theme="dark"] {
  --accent-solid: var(--color-primary-active);
}
/* Tier qualitative palette (Core/Growth/Moonshot) is deliberately independent
   of the user's chosen primary family — three tiers need to stay visually
   distinct from each other no matter which accent is selected — so it's
   pinned to fixed families from the raw scale, themed for light/dark only. */
:root[data-theme="light"],
:root:not([data-theme]) {
  --core: var(--indigo-700); --core-subtle: var(--indigo-100);
  --growth: var(--forest-700); --growth-subtle: var(--forest-100);
  --moonshot: var(--clay-700); --moonshot-subtle: var(--clay-100);
}
:root[data-theme="dark"] {
  --core: var(--indigo-300); --core-subtle: var(--indigo-900);
  --growth: var(--forest-300); --growth-subtle: var(--forest-900);
  --moonshot: var(--clay-300); --moonshot-subtle: var(--clay-900);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
a{color:var(--accent);}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* ============================================================
   LAYOUT — BANNER, TAB BAR
   ============================================================ */
#banner-container{position:sticky;top:0;z-index:40;}
.banner-warning{
  background:var(--color-warning-subtle);
  color:var(--warning);
  border-bottom:1px solid var(--warning);
  padding:10px 16px;
  font-size:13px;
  text-align:center;
}
.tabbar{
  position:sticky;top:0;z-index:30;
  display:flex;overflow-x:auto;white-space:nowrap;
  background:var(--bg);
  border-bottom:1px solid var(--card-border);
  padding:0 8px;
  scrollbar-width:thin;
}
.tab-btn{
  background:transparent;border:none;color:var(--text-secondary);
  padding:14px 16px;font-size:13px;font-weight:600;cursor:pointer;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
  flex-shrink:0;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}

#content{max-width:1200px;margin:0 auto;padding:20px 16px 40px;}

/* ============================================================
   PRIMITIVES — CARDS, GRIDS, BADGES, PILLS
   ============================================================ */
.grid{display:grid;gap:14px;margin-bottom:14px;}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:18px;
}
.card.highlight{border:1.5px solid var(--accent);}
.card+.card{margin-top:14px;}
.section-header{
  text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);
  font-size:11px;font-weight:600;margin:0 0 10px;
}
summary.section-header{cursor:pointer;user-select:none;}
summary.section-header::marker{color:var(--text-muted);}
details > summary.section-header{margin-bottom:0;}
details[open] > summary.section-header{margin-bottom:10px;}
.metric-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.metric-value{font-size:22px;font-weight:700;color:var(--text);}
.metric-sub{font-size:12px;color:var(--text-secondary);margin-top:4px;}
.metric-dual{display:flex;gap:16px;margin-top:2px;}
.metric-dual-item{flex:1;min-width:0;}
.metric-dual-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
.metric-dual-value{font-size:17px;font-weight:700;color:var(--text);overflow-wrap:break-word;}

@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.icon-spin{display:inline-flex;animation:spin .8s linear infinite;vertical-align:-3px;}
.icon-spin svg{vertical-align:baseline;}

.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;color:var(--text-on-primary);white-space:nowrap;}
.badge-success{background:var(--success);}
.badge-warning{background:var(--warning);color:#1a1408;}
.badge-danger{background:var(--danger);}
.badge-accent{background:var(--accent-solid);}
.badge-muted{background:var(--card-raised);color:var(--text-secondary);}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.pill-Core{background:var(--core-subtle);color:var(--core);}
.pill-Growth{background:var(--growth-subtle);color:var(--growth);}
.pill-Moonshot{background:var(--moonshot-subtle);color:var(--moonshot);}

.text-success{color:var(--success);}
.text-danger{color:var(--danger);}
.text-warning{color:var(--warning);}
.text-muted{color:var(--text-muted);}
.text-secondary{color:var(--text-secondary);}

.alert-box{
  border-left:2px solid var(--card-border);
  background:color-mix(in srgb, var(--text-primary) 3%, transparent);
  padding:10px 14px;border-radius:6px;font-size:13px;
  margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.alert-success{border-left-color:var(--success);background:var(--color-success-subtle);color:var(--color-success-fg);}
.alert-warning{border-left-color:var(--warning);background:var(--color-warning-subtle);color:var(--color-warning-fg);}
.alert-danger{border-left-color:var(--danger);background:var(--color-error-subtle);color:var(--color-error-fg);}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  background:var(--card-raised);border:1px solid var(--card-border);color:var(--text);
  padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;transition:background .15s,border-color .15s;
}
.btn:hover{background:color-mix(in srgb, var(--card-raised) 82%, var(--text-primary) 18%);}
.btn-primary{background:var(--accent-solid);border-color:var(--accent-solid);color:var(--text-on-primary);}
.btn-primary:hover{background:color-mix(in srgb, var(--accent-solid) 85%, black 15%);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--color-error-subtle);}
.btn-block{width:100%;}
.btn-lg{padding:14px 20px;font-size:15px;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

.row-menu-wrap{position:relative;display:inline-block;}
.row-menu{
  background:var(--card-raised);border:1px solid var(--card-border);border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);min-width:120px;z-index:150;overflow:hidden;
}
.row-menu-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 12px;background:transparent;border:none;color:var(--text);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.row-menu-item:hover{background:var(--bg);}
.row-menu-item.danger{color:var(--danger);}

/* ============================================================
   FORMS
   ============================================================ */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--bg);border:1px solid var(--card-border);color:var(--text);
  padding:9px 12px;border-radius:8px;font-size:13px;outline:none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
.form-textarea{resize:vertical;min-height:60px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.appearance-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;}
.segmented{display:inline-flex;background:var(--bg);border:1px solid var(--card-border);border-radius:999px;padding:3px;gap:2px;}
.segmented-btn{
  background:transparent;border:none;color:var(--text-secondary);
  padding:7px 18px;border-radius:999px;font-size:13px;font-weight:600;
  cursor:pointer;transition:background .15s,color .15s;
}
.segmented-btn.active{background:var(--accent-solid);color:var(--text-on-primary);}
.segmented-btn:not(.active):hover{color:var(--text);}
.swatch-row{display:flex;gap:10px;align-items:center;padding:4px 0;}
.swatch{
  width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;padding:0;
  box-shadow:0 0 0 1px var(--card-border) inset;transition:transform .1s,box-shadow .15s;
}
.swatch:hover{transform:scale(1.08);}
.swatch.active{box-shadow:0 0 0 2px var(--bg-surface), 0 0 0 4px var(--text-primary);}
.form-inline{display:flex;align-items:center;gap:8px;}
.form-inline .form-input{width:auto;}
.inline-result{font-size:12px;margin-top:8px;}

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px;}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--card-border);
  white-space:nowrap;
}
td{padding:10px;border-bottom:1px solid var(--card-border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:color-mix(in srgb, var(--text-primary) 3%, transparent);}
.ticker-cell{font-weight:700;}
.row-highlight{background:var(--color-success-subtle);}

/* ============================================================
   PROGRESS BARS
   ============================================================ */
.progress-track{position:relative;background:var(--bg);border-radius:999px;height:10px;overflow:visible;margin:14px 0 6px;}
.progress-fill{background:var(--accent);height:100%;border-radius:999px;transition:width .8s ease;}
.progress-milestone{position:absolute;top:-4px;width:2px;height:18px;background:var(--card-border);}

<script>
'use strict';
/* ================================================================
   1. STATE & CONSTANTS
   ================================================================ */
const GIST_FILENAME = 'porthos-data.json';
const LS_KEYS = {
  apiConfig: 'porthos_api_config',
  cacheData: 'porthos_cache_data',
  cachePrices: 'porthos_cache_prices',
  cacheFx: 'porthos_cache_fx',
  cacheSpy: 'porthos_cache_spy',
  sessionHigh: 'porthos_session_high_spy',
  spyHistory: 'porthos_spy_history',

  themePrefs: 'porthos_theme_prefs'
};

const DEFAULT_SETTINGS = {

  targetDate: '2035-10-01',
  cashBuffer: 20000,
  fxAlert: 31.0,

  driftThresholds: { Core: 3, Growth: 4, Moonshot: 5 },
  convictionBonus: { Core: 2, Growth: 1, Moonshot: 0 },
  cagrScenarios: { base: 20, good: 25, bull: 30 }
};

const DEFAULT_DCA_SCHEDULE = {
  '2026': 12000, '2027': 15000, '2028': 18000, '2029': 21000, '2030': 24000,
  '2031': 27000, '2032': 30000, '2033': 33000, '2034': 36000, '2035': 39000
};

const DEFAULT_POSITIONS = [
  { ticker: 'NVDA', tier: 'Core', shares: 2.08, avgCost: 169.7, targetWeight: 12 },
  { ticker: 'GOOGL', tier: 'Core', shares: 0, avgCost: 0, targetWeight: 8 },

  { ticker: 'AMZN', tier: 'Core', shares: 1.21, avgCost: 217.6, targetWeight: 8 },
  { ticker: 'TSM', tier: 'Core', shares: 0.39, avgCost: 334.0, targetWeight: 8 },
  { ticker: 'META', tier: 'Core', shares: 0, avgCost: 0, targetWeight: 7 },
  { ticker: 'LLY', tier: 'Core', shares: 0.22, avgCost: 917.1, targetWeight: 6 },
  { ticker: 'ALAB', tier: 'Growth', shares: 0.98, avgCost: 140.5, targetWeight: 8 },
  { ticker: 'PLTR', tier: 'Growth', shares: 1.31, avgCost: 194.7, targetWeight: 8 },
  { ticker: 'CRWD', tier: 'Growth', shares: 0.54, avgCost: 440.1, targetWeight: 6 },
  { ticker: 'CEG', tier: 'Growth', shares: 0.31, avgCost: 286.2, targetWeight: 5 },
  { ticker: 'ASTS', tier: 'Moonshot', shares: 0.60, avgCost: 76.5, targetWeight: 5 },
  { ticker: 'IONQ', tier: 'Moonshot', shares: 4.15, avgCost: 207.0, targetWeight: 5 }
];

// Main app data — this whole object (minus runtime fields) is what gets saved to the Gist.
let appData = {
  positions: [],
  dcaSchedule: JSON.parse(JSON.stringify(DEFAULT_DCA_SCHEDULE)),
  actionLog: [],
  notes: [],
  reviewHistory: [],
  settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS))
};

// API keys — localStorage ONLY, never written to the Gist.
let apiConfig = { finnhubKey: '', githubPat: '', gistId: '', discordWebhook: '', googleDriveClientId: '' };

// Runtime / market data (not persisted to Gist).
let prices = {};           // ticker -> {price, prevClose, dayChangePct, dayChangeAbs, ts, cached}
let fx = { rate: null, ts: null, cached: false };
let spy = { price: null, prevClose: null, dayChangePct: null, dayChangeAbs: null, ts: null, cached: false };
let sessionHigh = null;    // { price, since }
let lastRefresh = null;
let currentTab = 1;
let isLoadingPrices = false;
// Whole-operation loading flags — set true (and rendered) *before* the async
// work starts, unlike isLoadingPrices which fetchAllPrices only flips mid-flight
// after fx/spy have already been fetched, so those flags alone under-report
// how long the overall refresh is running.
let isMarketRefreshing = false;
let isNewsRefreshing = false;
let gistConfigured = false;

// Phase 2 runtime state (not persisted to Gist, except where noted).
let dcaCalcState = { budget: null, mode: 'Normal', dipTicker: null, result: null };
let dcaAllocationQueue = [];             // queue of allocations left to log via the DCA modal
let trimInitiateState = {};              // ticker -> bool, "would you initiate at today's price?"
let reviewDraft = { thesisChanged: null, thesisNotes: '', newPositions: '' };
let actionLogFilters = { tickers: [], dateFrom: '', dateTo: '', actionType: 'all', sortDir: 'desc' };
let newsState = { holdings: [], macro: [], lastRefresh: null, filter: 'all' };

// Current appearance selection — read from <html>'s data-* attributes rather
// than localStorage directly, since the inline head script may have already
// applied a stored preference before this script ran; documentElement is the
// single source of truth for what's actually painted right now.
let themePrefs = {
  theme: document.documentElement.getAttribute('data-theme') || 'dark',
  neutral: document.documentElement.getAttribute('data-neutral') || 'cool',
  primary: document.documentElement.getAttribute('data-primary') || 'indigo'
};

// Ticker whose Portfolio-tab row menu (Edit/Remove) is currently open, or null.
// The menu renders with position:fixed at openRowMenuPos (viewport coordinates
// captured when the toggle button was clicked) rather than position:absolute,
// since the table's horizontal scroll container would otherwise clip it.
let openRowMenuTicker = null;
let openRowMenuPos = null;

/* ================================================================
   2. UTILITIES
   ================================================================ */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function fmtUSD(n, dec = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtTHB(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '฿' + Math.round(Number(n)).toLocaleString('en-US');
}
function fmtPct(n, dec = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const s = Number(n).toFixed(dec);
  return (n > 0 ? '+' : '') + s + '%';
}
function fmtNum(n, dec = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function todayISO() { return new Date().toISOString().slice(0, 10); }

function ymDiff(d1, d2) {
  // Non-negative years/months between d1 and d2 (d2 >= d1 assumed; clamps otherwise).
  if (d2 < d1) return { years: 0, months: 0 };
  let years = d2.getFullYear() - d1.getFullYear();
  let months = d2.getMonth() - d1.getMonth();
  if (d2.getDate() < d1.getDate()) months -= 1;
  if (months < 0) { years -= 1; months += 12; }
  if (years < 0) { years = 0; months = 0; }
  return { years, months };
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function toast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

function animateValue(el, endValue, formatter, duration = 700) {
  if (!el) return;
  const start = performance.now();
  const startValue = 0;
  function step(now) {
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    const current = startValue + (endValue - startValue) * eased;
    el.textContent = formatter(current);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = formatter(endValue);
  }
  requestAnimationFrame(step);
}

/* ================================================================
   3. PERSISTENCE — localStorage + GitHub Gist
   ================================================================ */
function loadApiConfigFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEYS.apiConfig);
    if (raw) apiConfig = Object.assign(apiConfig, JSON.parse(raw));
  } catch (e) { /* ignore corrupt storage */ }
  gistConfigured = !!(apiConfig.githubPat && apiConfig.gistId);
}
function saveApiConfigToStorage() {
  localStorage.setItem(LS_KEYS.apiConfig, JSON.stringify(apiConfig));
  gistConfigured = !!(apiConfig.githubPat && apiConfig.gistId);
}

function loadCacheFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEYS.cacheData);
    if (raw) {
      const parsed = JSON.parse(raw);
      appData = Object.assign(appData, parsed);
      appData.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), parsed.settings || {});
      appData.positions.forEach(ensurePositionBase);
      ensureLogIds();
      recomputeAllPositionsFromLog();
    }
  } catch (e) { /* ignore */ }
  try {
    const p = localStorage.getItem(LS_KEYS.cachePrices);
    if (p) prices = JSON.parse(p);
  } catch (e) { /* ignore */ }
  try {
    const f = localStorage.getItem(LS_KEYS.cacheFx);
    if (f) fx = JSON.parse(f);
  } catch (e) { /* ignore */ }
  try {
    const s = localStorage.getItem(LS_KEYS.cacheSpy);
    if (s) spy = JSON.parse(s);
  } catch (e) { /* ignore */ }
  try {
    const sh = localStorage.getItem(LS_KEYS.sessionHigh);
    if (sh) sessionHigh = JSON.parse(sh);
  } catch (e) { /* ignore */ }
}

function persistDataCache() {
  localStorage.setItem(LS_KEYS.cacheData, JSON.stringify(appData));
}
function persistPricesCache() { localStorage.setItem(LS_KEYS.cachePrices, JSON.stringify(prices)); }
function persistFxCache() { localStorage.setItem(LS_KEYS.cacheFx, JSON.stringify(fx)); }
function persistSpyCache() { localStorage.setItem(LS_KEYS.cacheSpy, JSON.stringify(spy)); }
function persistSessionHigh() { localStorage.setItem(LS_KEYS.sessionHigh, JSON.stringify(sessionHigh)); }

async function gistGet(pat, gistId) {
  const res = await fetch('https://api.github.com/gists/' + encodeURIComponent(gistId), {
    headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github+json' }
  });
  if (!res.ok) throw new Error('GitHub API ' + res.status + ': ' + res.statusText);
  return res.json();
}

async function gistSave(pat, gistId, dataObj) {
  const body = { files: {} };
  body.files[GIST_FILENAME] = { content: JSON.stringify(dataObj, null, 2) };
  const res = await fetch('https://api.github.com/gists/' + encodeURIComponent(gistId), {
    method: 'PATCH',
    headers: {
      'Authorization': 'token ' + pat,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('GitHub API ' + res.status + ': ' + res.statusText);
  return res.json();
}

async function tryLoadFromGist(silent = false) {
  if (!gistConfigured) return false;
  try {
    const gist = await gistGet(apiConfig.githubPat, apiConfig.gistId);
    let file = gist.files && (gist.files[GIST_FILENAME] || Object.values(gist.files)[0]);
    if (!file || !file.content) throw new Error('Gist has no readable file');
    const parsed = JSON.parse(file.content);
    appData.positions = parsed.positions || [];
    appData.dcaSchedule = parsed.dcaSchedule || JSON.parse(JSON.stringify(DEFAULT_DCA_SCHEDULE));
    appData.actionLog = parsed.actionLog || [];
    appData.notes = parsed.notes || [];
    appData.reviewHistory = parsed.reviewHistory || [];
    appData.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), parsed.settings || {});
    appData.positions.forEach(ensurePositionBase);
    ensureLogIds();
    recomputeAllPositionsFromLog();
    persistDataCache();
    if (!silent) toast('Loaded latest data from Gist', 'success');
    return true;
  } catch (e) {
    if (!silent) toast('Gist load failed — using cached data (' + e.message + ')', 'error');
    return false;
  }
}

async function trySaveToGist(silent = false) {
  if (!gistConfigured) {
    if (!silent) toast('Gist not configured — go to Settings', 'error');
    return false;
  }
  try {
    await gistSave(apiConfig.githubPat, apiConfig.gistId, appData);
    persistDataCache();
    if (!silent) toast('Saved to Gist', 'success');
    return true;
  } catch (e) {
    toast('Gist save failed: ' + e.message, 'error');
    return false;
  }
}
const debouncedSaveToGist = debounce(() => trySaveToGist(true), 1200);

/* ================================================================
   4. MARKET DATA — Finnhub quotes, FX rate, SPY proxy
   ================================================================ */
async function fetchFxRate() {
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    if (!res.ok) throw new Error('FX API ' + res.status);
    const data = await res.json();
    if (!data.rates || !data.rates.THB) throw new Error('THB rate missing');
    fx = { rate: data.rates.THB, ts: Date.now(), cached: false };
    persistFxCache();
  } catch (e) {
    fx = Object.assign({}, fx, { cached: true });
    toast('FX rate fetch failed — using cached rate', 'error');
  }
}

async function fetchQuote(ticker) {
  if (!apiConfig.finnhubKey) return null;
  const url = 'https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(ticker) + '&token=' + encodeURIComponent(apiConfig.finnhubKey);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Finnhub API ' + res.status);
  const data = await res.json();
  if (data.c === undefined) throw new Error('Malformed Finnhub response');
  return data; // {c, h, l, o, pc, t}
}

async function fetchAllPrices() {
  if (!apiConfig.finnhubKey) return;
  isLoadingPrices = true;
  const tickers = appData.positions.map(p => p.ticker);
  for (const ticker of tickers) {
    try {
      const q = await fetchQuote(ticker);
      if (q) {
        prices[ticker] = {
          price: q.c, prevClose: q.pc,
          dayChangeAbs: q.c - q.pc,
          dayChangePct: q.pc ? ((q.c - q.pc) / q.pc) * 100 : 0,
          ts: Date.now(), cached: false
        };
      }
    } catch (e) {
      if (prices[ticker]) prices[ticker] = Object.assign({}, prices[ticker], { cached: true });
    }
    await sleep(100); // rate-limit friendliness
  }
  persistPricesCache();
  isLoadingPrices = false;
}

async function fetchSpyData() {
  // Tracks the actual S&P 500 index (Finnhub symbol ^GSPC), not the SPY ETF proxy.
  // Internal variable/storage names keep the historical "spy" naming to avoid
  // churning unrelated persistence keys.
  if (!apiConfig.finnhubKey) return;
  try {
    const q = await fetchQuote('^GSPC');
    spy = {
      price: q.c, prevClose: q.pc,
      dayChangeAbs: q.c - q.pc,
      dayChangePct: q.pc ? ((q.c - q.pc) / q.pc) * 100 : 0,
      ts: Date.now(), cached: false
    };
    persistSpyCache();
    // Session/local "52-week high" tracking — Finnhub free tier has no true 52wk-high field,
    // so we track the highest price this app has ever observed, persisted across sessions.
    if (!sessionHigh || q.c > sessionHigh.price) {
      sessionHigh = { price: q.c, since: sessionHigh ? sessionHigh.since : todayISO() };
      persistSessionHigh();
    }
    recordSpyHistory(q.c);
  } catch (e) {
    spy = Object.assign({}, spy, { cached: true });
  }
}

// Rolling 90-day SPY close history, used for the Rebalancing tab's drawdown gauge
// (Finnhub free tier has no 90-day-high field, so we build it ourselves over time).
function recordSpyHistory(price) {
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(LS_KEYS.spyHistory) || '[]'); } catch (e) { hist = []; }
  const today = todayISO();
  const idx = hist.findIndex(h => h.date === today);
  if (idx >= 0) hist[idx].close = price; else hist.push({ date: today, close: price });
  hist = hist.slice(-90);
  localStorage.setItem(LS_KEYS.spyHistory, JSON.stringify(hist));
  return hist;
}

function getSpy90dHigh() {
  try {
    const hist = JSON.parse(localStorage.getItem(LS_KEYS.spyHistory) || '[]');
    if (!hist.length) return null;
    return Math.max(...hist.map(h => h.close));
  } catch (e) { return null; }
}

async function refreshAllMarketData() {
  await fetchFxRate();
  await fetchSpyData();
  await fetchAllPrices();
  lastRefresh = Date.now();
  renderAll();
}

/* ================================================================
   5. CALCULATIONS
   ================================================================ */
function getPrice(ticker) {
  return prices[ticker] ? prices[ticker].price : null;
}

function computeCashTotals() {
  const cashUSD = Number(appData.settings.cashUSD) || 0;
  const cashTHB = Number(appData.settings.cashTHB) || 0;
  const rate = fx.rate || 0;
  const cashTotalUSD = cashUSD + (rate ? cashTHB / rate : 0);
  const cashTotalTHB = cashTHB + (cashUSD * rate);
  return { cashUSD, cashTHB, cashTotalUSD, cashTotalTHB };
}

function computePortfolioMetrics() {
  const rate = fx.rate || 0;
  let totalValueUSD = 0, totalCostUSD = 0;
  const tierValue = { Core: 0, Growth: 0, Moonshot: 0 };
  const rows = appData.positions.map(pos => {
    const price = getPrice(pos.ticker);
    // When no live/cached price exists yet, fall back to cost basis for aggregate math
    // so an unfetched price reads as "unknown" rather than a false -100% loss.
    const effectivePrice = price !== null ? price : pos.avgCost;
    const value = pos.shares * effectivePrice;
    const cost = pos.shares * pos.avgCost;
    totalValueUSD += value;
    totalCostUSD += cost;
    if (tierValue[pos.tier] !== undefined) tierValue[pos.tier] += value;
    return { pos, price, value, cost };
  });
  const { cashTotalUSD } = computeCashTotals();
  const grandTotalUSD = totalValueUSD + cashTotalUSD;

  rows.forEach(r => {
    r.currentWeight = grandTotalUSD > 0 ? (r.value / grandTotalUSD) * 100 : 0;
    r.plPct = r.cost > 0 ? ((r.value - r.cost) / r.cost) * 100 : null;
    r.drift = r.currentWeight - r.pos.targetWeight; // + overweight, - underweight
    const threshold = (appData.settings.driftThresholds && appData.settings.driftThresholds[r.pos.tier] !== undefined)
      ? appData.settings.driftThresholds[r.pos.tier] : 4;
    r.threshold = threshold;
    const driftScore = (r.pos.targetWeight - r.currentWeight) * 10;
    const convictionBonus = (appData.settings.convictionBonus && appData.settings.convictionBonus[r.pos.tier] !== undefined)
      ? appData.settings.convictionBonus[r.pos.tier] : 0;
    let valuationBonus = 0;
    if (r.pos.avgCost > 0 && r.price !== null) {
      if (r.price < r.pos.avgCost * 0.9) valuationBonus = 2;
      else if (r.price < r.pos.avgCost * 0.95) valuationBonus = 1;
    }
    r.driftScore = driftScore;
    r.convictionBonus = convictionBonus;
    r.valuationBonus = valuationBonus;
    r.score = driftScore + convictionBonus + valuationBonus;
    // Action badge — overweight-beyond-threshold (TRIM) takes priority since it is the
    // most operationally urgent signal; remaining cases fall back on score sign.
    if (r.drift > threshold) r.action = 'TRIM';
    else if (r.score < 0) r.action = (Math.abs(r.drift) > threshold) ? 'DO_NOT_ADD' : 'HOLD';
    else if (r.score > 0) r.action = 'BUY';
    else r.action = 'HOLD';
  });

  return { rows, totalValueUSD, totalCostUSD, tierValue, grandTotalUSD, rate };
}

/* ----------------------------------------------------------------
   Position base + DCA log reconciliation.
   pos.baseShares/baseAvgCost are the user-editable "starting" holdings
   (what you type in Portfolio when you first set up a position). The
   displayed/used pos.shares/pos.avgCost are always DERIVED by replaying
   every actionLog entry for that ticker, in date order, on top of the
   base. This makes editing or deleting a past DCA log entry — or
   editing the base Shares/Avg Cost directly — safe and consistent,
   since the current holdings are always recomputed from scratch rather
   than mutated incrementally.
   ---------------------------------------------------------------- */
function ensurePositionBase(pos) {
  if (pos.baseShares === undefined) pos.baseShares = pos.shares;
  if (pos.baseAvgCost === undefined) pos.baseAvgCost = pos.avgCost;
  return pos;
}

function genId() {
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

function ensureLogIds() {
  appData.actionLog.forEach(e => { if (!e.id) e.id = genId(); });
}

function recomputeAllPositionsFromLog() {
  appData.positions.forEach(pos => {
    ensurePositionBase(pos);
    const entries = appData.actionLog
      .filter(e => e.ticker === pos.ticker)
      .slice()
      .sort((a, b) => (new Date(a.date) - new Date(b.date)) || ((a.timestamp || 0) - (b.timestamp || 0)));
    let shares = pos.baseShares || 0;
    let avgCost = pos.baseAvgCost || 0;
    entries.forEach(e => {
      const entryShares = Number(e.shares) || 0;
      const newShares = shares + entryShares;
      if (newShares !== 0) {
        // Buys blend into a new weighted-average cost; sells/trims (negative
        // shares) don't change the cost basis of the shares that remain.
        if (entryShares > 0) avgCost = (shares * avgCost + entryShares * (Number(e.price) || 0)) / newShares;
      } else {
        avgCost = 0;
      }
      shares = newShares;
    });
    pos.shares = shares;
    pos.avgCost = avgCost;
  });
}

function getMonthlyDCA(year) {
  const keys = Object.keys(appData.dcaSchedule).map(Number).sort((a, b) => a - b);
  if (!keys.length) return 0;
  if (year <= keys[0]) return appData.dcaSchedule[String(keys[0])];
  if (year >= keys[keys.length - 1]) return appData.dcaSchedule[String(keys[keys.length - 1])];
  return appData.dcaSchedule[String(year)] !== undefined ? appData.dcaSchedule[String(year)] : appData.dcaSchedule[String(keys[0])];
}

// New-position starter tranche: fraction of a position's full target weight
// suggested as the first buy when it has never been bought (no cost basis to
// anchor a "better" entry against, so we scale in rather than buy the full
// target weight in one trade). Documented in the Rebalancing tab's methodology card.
const STARTER_TRANCHE_FRACTION = 0.5;

const SCENARIO_META = [
  { key: 'base', label: 'Base Case', color: 'var(--text)' },
  { key: 'good', label: 'Good Case', color: 'var(--accent)' },
  { key: 'bull', label: 'Bull Case', color: 'var(--success)' }
];

function computeRequiredMonthlyDCA(currentValueTHB, cagrPct, monthsToTarget) {
  if (monthsToTarget <= 0) return 0;
  const r = Math.pow(1 + cagrPct / 100, 1 / 12) - 1;
  const growthFactor = Math.pow(1 + r, monthsToTarget);
  const required = (appData.settings.goalTHB - currentValueTHB * growthFactor) * r / (growthFactor - 1);
  return Math.max(0, required);
}

// Single source of truth for goal-scenario math — used by the Dashboard's Goal
// Progress card, the Projection tab, and both tabs' projection charts. Each
// scenario carries a month-by-month simulated series (stepped DCA schedule)
// so the chart and the summary numbers never disagree with each other.
function computeScenarios(currentValueTHB) {
  const today = new Date();
  const target = new Date(appData.settings.targetDate);
  const monthsToTarget = Math.max(0, (target.getFullYear() - today.getFullYear()) * 12 + (target.getMonth() - today.getMonth()));
  const cagrSettings = appData.settings.cagrScenarios || DEFAULT_SETTINGS.cagrScenarios;

  const scenarios = SCENARIO_META.map(meta => {
    const cagrPct = Number(cagrSettings[meta.key]) || 0;
    const r = Math.pow(1 + cagrPct / 100, 1 / 12) - 1;
    let value = currentValueTHB;
    let d = new Date(today.getFullYear(), today.getMonth(), 1);
    const series = [{ date: new Date(d), value }];
    let goalYear = null;
    const totalSteps = Math.max(monthsToTarget, 40 * 12);
    for (let m = 0; m < totalSteps; m++) {
      const pmt = getMonthlyDCA(d.getFullYear());
      value = value * (1 + r) + pmt;
      d.setMonth(d.getMonth() + 1);
      series.push({ date: new Date(d), value });
      if (goalYear === null && value >= appData.settings.goalTHB) goalYear = d.getFullYear();
      if (m + 1 >= monthsToTarget && (goalYear !== null || m + 1 >= 40 * 12)) break;
    }
    const terminalValue = series[Math.min(monthsToTarget, series.length - 1)].value;
    const requiredPMT = computeRequiredMonthlyDCA(currentValueTHB, cagrPct, monthsToTarget);
    return Object.assign({}, meta, { cagrPct, series, terminalValue, goalYear, requiredPMT, monthsToTarget });
  });

  let earliestIdx = 0, earliestVal = Infinity;
  scenarios.forEach((s, i) => {
    const y = s.goalYear === null ? Infinity : s.goalYear;
    if (y < earliestVal) { earliestVal = y; earliestIdx = i; }
  });
  scenarios.forEach((s, i) => s.isEarliest = (i === earliestIdx && s.goalYear !== null));

  let closestIdx = 0, closestDiff = Infinity;
  scenarios.forEach((s, i) => {
    const diff = Math.abs(s.terminalValue - appData.settings.goalTHB);
    if (diff < closestDiff) { closestDiff = diff; closestIdx = i; }
  });
  scenarios.forEach((s, i) => s.isClosest = i === closestIdx);

  return scenarios;
}

function renderProjectionChartSVG(scenarios, currentValueTHB) {
  const startDate = new Date(appData.settings.startDate);
  const targetDate = new Date(appData.settings.targetDate);
  const today = new Date();
  const totalMs = targetDate - startDate;
  if (!(totalMs > 0)) {
    return '<div class="metric-sub text-muted">Set a valid start/target date range to see the projection chart.</div>';
  }

  const width = 720, height = 260, padL = 60, padR = 16, padT = 16, padB = 26;
  const innerW = width - padL - padR, innerH = height - padT - padB;
  const xFor = d => padL + Math.max(0, Math.min(1, (d - startDate) / totalMs)) * innerW;

  const allValues = [currentValueTHB, appData.settings.goalTHB];
  scenarios.forEach(s => s.series.forEach(p => { if (p.date <= targetDate) allValues.push(p.value); }));
  const maxVal = Math.max(...allValues, 1) * 1.08;
  const yFor = v => padT + innerH - (Math.max(0, v) / maxVal) * innerH;

  const linesHtml = scenarios.map(s => {
    const pts = s.series.filter(p => p.date >= today && p.date <= targetDate).map(p => `${xFor(p.date).toFixed(1)},${yFor(p.value).toFixed(1)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
  }).join('');

  const goalY = yFor(appData.settings.goalTHB);
  const todayX = xFor(today);

  const years = [];
  for (let y = startDate.getFullYear(); y <= targetDate.getFullYear(); y++) years.push(y);
  const yearStep = Math.max(1, Math.ceil(years.length / 6));
  const ticksHtml = years.filter((y, i) => i % yearStep === 0).map(y => {
    const x = xFor(new Date(y, 0, 1));
    return `<text x="${x.toFixed(1)}" y="${height - 8}" font-size="10" fill="var(--text-muted)" text-anchor="middle">${y}</text>`;
  }).join('');

  return `
  <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${goalY.toFixed(1)}" x2="${width - padR}" y2="${goalY.toFixed(1)}" stroke="var(--card-border)" stroke-dasharray="4 3"/>
    <text x="${width - padR}" y="${(goalY - 5).toFixed(1)}" font-size="10" fill="var(--text-muted)" text-anchor="end">Goal ${fmtTHB(appData.settings.goalTHB)}</text>
    <line x1="${todayX.toFixed(1)}" y1="${padT}" x2="${todayX.toFixed(1)}" y2="${height - padB}" stroke="var(--card-border)" stroke-dasharray="2 2"/>
    <text x="${todayX.toFixed(1)}" y="${padT + 10}" font-size="10" fill="var(--text-muted)" text-anchor="middle">Today</text>
    ${linesHtml}
    <circle cx="${todayX.toFixed(1)}" cy="${yFor(currentValueTHB).toFixed(1)}" r="3.5" fill="var(--text)"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${height - padB}" stroke="var(--card-border)"/>
    <line x1="${padL}" y1="${height - padB}" x2="${width - padR}" y2="${height - padB}" stroke="var(--card-border)"/>
    ${ticksHtml}
  </svg>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;">
    ${scenarios.map(s => `<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block;"></span>${esc(s.label)} (${s.cagrPct}%)</span>`).join('')}
  </div>`;
}

function computeAlerts(metrics) {
  const alerts = [];
  // DCA fallback alert
  const today = new Date();
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  if (daysInMonth - today.getDate() < 5) {
    const hasEntryThisMonth = appData.actionLog.some(e => {
      const d = new Date(e.date);
      return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth();
    });
    if (!hasEntryThisMonth) {
      alerts.push({ type: 'warning', html: 'DCA fallback due this month — no deployment logged yet' });
    }
  }
  // Drift alerts
  metrics.rows.forEach(r => {
    if (Math.abs(r.drift) > r.threshold) {
      if (r.drift > 0) {
        alerts.push({ type: 'warning', html: `<span class="badge badge-warning">${esc(r.pos.ticker)} ${fmtPct(r.drift, 1)} TRIM</span>` });
      } else {
        alerts.push({ type: 'accent', html: `<span class="badge badge-accent">${esc(r.pos.ticker)} ${fmtPct(r.drift, 1)} UNDERWEIGHT</span>` });
      }
    }
  });
  // FX alert
  if (fx.rate && fx.rate < appData.settings.fxAlert) {
    alerts.push({ type: 'danger', html: 'USD/THB below ฿' + appData.settings.fxAlert.toFixed(2) + ' — review remittance plan' });
  }
  return alerts;
}

// Priority-score-driven monthly allocation calculator. Reuses the same
// driftScore/convictionBonus/valuationBonus scoring as computePortfolioMetrics
// (Portfolio tab's Action column) so the two stay consistent.
function calculateDcaAllocation(rawBudget, mode, dipTicker) {
  const metrics = computePortfolioMetrics();
  let budget = Number(rawBudget) || 0;
  if (mode === 'Crash') budget = budget * 3;

  let candidates = metrics.rows
    .filter(r => r.score > 0)
    .map(r => {
      let score = r.score;
      if (mode === 'Dip trigger' && dipTicker && r.pos.ticker === dipTicker) score *= 1.25;
      if (mode === 'Macro event' && (r.pos.tier === 'Growth' || r.pos.tier === 'Moonshot')) score *= 2;
      return { r, score };
    });

  let scoreSum = candidates.reduce((s, c) => s + c.score, 0);
  if (scoreSum <= 0 || candidates.length === 0 || budget <= 0) {
    return { budget, mode, allocations: [] };
  }

  const cap = budget * 0.4;
  let allocations = candidates.map(c => ({
    r: c.r, score: c.score,
    amountTHB: Math.min(cap, (c.score / scoreSum) * budget)
  }));

  // Drop any allocation below the ฿2,000 floor and redistribute its share
  // proportionally across the remaining candidates, repeating until stable.
  for (let iter = 0; iter < 10; iter++) {
    const below = allocations.filter(a => a.amountTHB > 0 && a.amountTHB < 2000);
    if (!below.length) break;
    const removedTotal = below.reduce((s, a) => s + a.amountTHB, 0);
    allocations = allocations.filter(a => !(a.amountTHB > 0 && a.amountTHB < 2000));
    if (!allocations.length) break;
    const remainingScoreSum = allocations.reduce((s, a) => s + a.score, 0);
    allocations.forEach(a => {
      a.amountTHB = Math.min(cap, a.amountTHB + (a.score / remainingScoreSum) * removedTotal);
    });
  }

  const rate = fx.rate || 0;
  const finalAllocations = allocations.map(a => {
    const amountUSD = rate ? a.amountTHB / rate : 0;
    const price = a.r.price !== null ? a.r.price : a.r.pos.avgCost;
    const sharesToBuy = price > 0 ? amountUSD / price : 0;
    const curShares = a.r.pos.shares;
    const curAvgCost = a.r.pos.avgCost;
    const newShares = curShares + sharesToBuy;
    const newAvgCost = newShares > 0 ? (curShares * curAvgCost + sharesToBuy * price) / newShares : curAvgCost;
    const costBasisImprovementPct = curAvgCost > 0 ? ((curAvgCost - newAvgCost) / curAvgCost) * 100 : 0;
    return {
      ticker: a.r.pos.ticker, tier: a.r.pos.tier, score: a.score,
      allocationPct: budget > 0 ? (a.amountTHB / budget) * 100 : 0,
      amountTHB: a.amountTHB, amountUSD, price, sharesToBuy, newAvgCost, costBasisImprovementPct
    };
  }).sort((x, y) => y.amountTHB - x.amountTHB);

  return { budget, mode, allocations: finalAllocations };
}

  const totalContributedTHB = appData.actionLog.reduce((s, e) => s + (Number(e.totalTHB) || 0), 0);

  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(2035, 11, 1);
  let plannedRemaining = 0;
  while (d <= end) {
    plannedRemaining += getMonthlyDCA(d.getFullYear());
    d.setMonth(d.getMonth() + 1);

  return `

function getCurrentHalfLabel() {
  const now = new Date();
  return (now.getMonth() < 6 ? 'H1 ' : 'H2 ') + now.getFullYear();
}

function getNextReviewDate() {
  const now = new Date();
  const jul1 = new Date(now.getFullYear(), 6, 1);
  return now < jul1 ? jul1 : new Date(now.getFullYear() + 1, 0, 1);
}

function renderDrawdownGauge(drawdownPct) {
  const dd = drawdownPct === null || drawdownPct === undefined ? 0 : Math.min(0, drawdownPct);
  const pct = Math.min(100, (Math.abs(dd) / 30) * 100);
  let color = 'var(--success)';
  if (dd <= -15) color = 'var(--danger)';
  else if (dd <= -5) color = 'var(--warning)';
  const markerPos = v => (v / 30) * 100;
  return `
  <div class="progress-track" style="margin-top:24px;">
    <div class="progress-fill" style="width:${pct}%;background:${color};"></div>
    <div class="progress-milestone" style="left:${markerPos(7)}%;"><span>-7%</span></div>
    <div class="progress-milestone" style="left:${markerPos(15)}%;"><span>-15%</span></div>
    <div class="progress-milestone" style="left:${markerPos(20)}%;"><span>-20%</span></div>
    <div class="progress-milestone" style="left:${markerPos(30)}%;"><span>-30%</span></div>
  </div>
  <div class="metric-sub" style="margin-top:20px;">${drawdownPct === null || drawdownPct === undefined ? 'Building drawdown history...' : fmtPct(drawdownPct) + ' from high'}</div>`;
}

function renderDrawdownProtocols(dd) {
  if (dd === null || dd === undefined) return '';
  const cards = [];
  if (dd <= -7) cards.push(['alert-box', 'style="border-left-color:var(--accent);background:rgba(79,142,247,.08);color:var(--accent);"', 'Correction Protocol: Deploy 1× monthly DCA into Core tier. Execute within 5 trading days.']);
  if (dd <= -15) cards.push(['alert-box alert-warning', '', 'Significant Correction Protocol: Stage deployment — 1/3 now into Core, 1/3 at -20%, 1/3 at -25%.']);
  if (dd <= -20) cards.push(['alert-box alert-danger', '', 'Bear Market Protocol: Deploy 50% of cash reserve into Core tier highest conviction names.']);
  if (dd <= -30) cards.push(['alert-box alert-danger', '', 'Deep Bear Protocol: Deploy remaining cash reserve. Review all moonshot positions for thesis integrity.']);
  if (!cards.length) return '<div class="alert-box alert-success">✓ No drawdown protocol active</div>';
  return cards.map(([cls, style, text]) => `<div class="${cls}" ${style}>${text}</div>`).join('');
}

function renderSemiAnnualReview(metrics) {
  const halfLabel = getCurrentHalfLabel();
  const nextReview = getNextReviewDate();

function actionLogEntryType(e) {
  if (e.reason === 'Rebalancing trim') return 'Rebalancing trim';
  if (e.reason === 'Rebalancing buy') return 'Rebalancing buy';
  if (e.reason === 'Manual') return 'Manual';
  return 'DCA buy';
}

// Replays the action log chronologically to derive the avg-cost-before/after
// each entry, mirroring recomputeAllPositionsFromLog's math without mutating
// the live position state.
function computeActionLogEnriched() {
  const state = {};
  appData.positions.forEach(p => { state[p.ticker] = { shares: p.baseShares || 0, avgCost: p.baseAvgCost || 0, tier: p.tier }; });
  const sorted = appData.actionLog.slice().sort((a, b) =>
    (new Date(a.date) - new Date(b.date)) || ((a.timestamp || 0) - (b.timestamp || 0)));
  const enriched = [];
  sorted.forEach(e => {
    const st = state[e.ticker] || (state[e.ticker] = { shares: 0, avgCost: 0, tier: '—' });
    const before = { shares: st.shares, avgCost: st.avgCost };
    const entryShares = Number(e.shares) || 0;
    const newShares = st.shares + entryShares;
    let newAvgCost = st.avgCost;
    if (newShares !== 0) {
      if (entryShares > 0) newAvgCost = (st.shares * st.avgCost + entryShares * (Number(e.price) || 0)) / newShares;
    } else {
      newAvgCost = 0;
    }
    st.shares = newShares; st.avgCost = newAvgCost;
    const costBasisDeltaPct = before.avgCost > 0 ? ((newAvgCost - before.avgCost) / before.avgCost) * 100 : null;
    enriched.push({
      entry: e, tier: st.tier,
      avgCostBefore: before.avgCost, avgCostAfter: newAvgCost, costBasisDeltaPct,
      type: actionLogEntryType(e)
    });
  });
  return enriched;
}

async function googleDriveAuth() {
  return new Promise(resolve => {
    if (!apiConfig.googleDriveClientId) { resolve(null); return; }
    const redirectUri = window.location.origin + window.location.pathname;
    const params = new URLSearchParams({
      client_id: apiConfig.googleDriveClientId,
      redirect_uri: redirectUri,
      response_type: 'token',
      scope: 'https://www.googleapis.com/auth/drive.file',
      include_granted_scopes: 'true',
      state: 'porthos_gdrive'
    });
    const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
    const popup = window.open(authUrl, 'porthos_gdrive_auth', 'width=480,height=640');
    if (!popup) { toast('Popup blocked — allow popups for this site', 'error'); resolve(null); return; }
    const timer = setInterval(() => {
      if (popup.closed) { clearInterval(timer); resolve(null); return; }
      try {
        const url = popup.location.href;
        if (url && url.indexOf(redirectUri) === 0) {
          const hash = new URL(url).hash.replace(/^#/, '');
          const token = new URLSearchParams(hash).get('access_token');
          popup.close();
          clearInterval(timer);
          if (token) { localStorage.setItem(LS_KEYS.gdriveToken, token); resolve(token); }
          else resolve(null);
        }
      } catch (e) { /* cross-origin while on accounts.google.com — ignore until redirect lands */ }
    }, 500);
  });
}

async function saveToGoogleDrive() {
  if (!apiConfig.googleDriveClientId) { toast('Add a Google Drive Client ID in Settings → Integrations first', 'error'); return; }
  let token = localStorage.getItem(LS_KEYS.gdriveToken);
  if (!token) {
    token = await googleDriveAuth();
    if (!token) { toast('Google Drive authorisation cancelled', 'error'); return; }
  }
  try {
    const filename = 'porthos-backup-' + todayISO() + '.json';
    const metadata = { name: filename, mimeType: 'application/json' };
    const boundary = 'porthos-boundary';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(appData)}\r\n--${boundary}--`;
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + boundary },
      body
    });
    if (!res.ok) {
      if (res.status === 401) {
        localStorage.removeItem(LS_KEYS.gdriveToken);
        toast('Google Drive session expired — click Save to Google Drive again to reauthorise', 'error');
        return;
      }
      throw new Error('Drive API ' + res.status);
    }
    toast('Saved ' + filename + ' to Google Drive', 'success');
  } catch (e) {
    toast('Google Drive save failed: ' + e.message, 'error');
  }
}

function renderActionLogTab() {
  const enriched = computeActionLogEnriched();
  const allTickers = Array.from(new Set(appData.actionLog.map(e => e.ticker))).sort();

  let filtered = enriched.filter(x => {
    if (actionLogFilters.tickers.length && !actionLogFilters.tickers.includes(x.entry.ticker)) return false;
    if (actionLogFilters.dateFrom && x.entry.date < actionLogFilters.dateFrom) return false;
    if (actionLogFilters.dateTo && x.entry.date > actionLogFilters.dateTo) return false;
    if (actionLogFilters.actionType !== 'all' && x.type !== actionLogFilters.actionType) return false;
    return true;
  });

  filtered.sort((a, b) => {
    const d = (new Date(a.entry.date) - new Date(b.entry.date)) || ((a.entry.timestamp || 0) - (b.entry.timestamp || 0));
    return actionLogFilters.sortDir === 'desc' ? -d : d;
  });

  const totalTHB = filtered.reduce((s, x) => s + (Number(x.entry.totalTHB) || 0), 0);
  const totalUSD = filtered.reduce((s, x) => s + ((Number(x.entry.shares) || 0) * (Number(x.entry.price) || 0)), 0);
  const tickerCounts = {};
  filtered.forEach(x => { tickerCounts[x.entry.ticker] = (tickerCounts[x.entry.ticker] || 0) + 1; });
  let mostBought = '—', mostBoughtCount = 0;
  Object.entries(tickerCounts).forEach(([t, c]) => { if (c > mostBoughtCount) { mostBought = t; mostBoughtCount = c; } });
  const dates = filtered.map(x => new Date(x.entry.date)).filter(d => !isNaN(d));
  let avgMonthly = 0;
  if (dates.length) {
    const earliest = new Date(Math.min(...dates));
    const now = new Date();
    const months = Math.max(1, (now.getFullYear() - earliest.getFullYear()) * 12 + (now.getMonth() - earliest.getMonth()) + 1);
    avgMonthly = totalTHB / months;
  }

  return `
  <div class="card">
    <div class="metric-sub" style="margin-bottom:10px;">Every DCA buy, manual buy/sell, and rebalancing trim or buy — however it was logged — lands here as a single historical record.</div>

  </div>

  <div class="card">
    <div class="section-header">Filters</div>
    <div class="form-row">

function renderFxImpactPanel(metrics) {
  const currentValueUSD = metrics.totalValueUSD;
  const today = new Date();
  const target = new Date(appData.settings.targetDate);
  const targetYear = target.getFullYear();
  const monthsToTarget = Math.max(0, (target.getFullYear() - today.getFullYear()) * 12 + (target.getMonth() - today.getMonth()));
  const goodCagr = Number((appData.settings.cagrScenarios || DEFAULT_SETTINGS.cagrScenarios).good) || 0;
  const r = Math.pow(1 + goodCagr / 100, 1 / 12) - 1;
  const growthFactor = Math.pow(1 + r, monthsToTarget);
  const pmtNow = getMonthlyDCA(today.getFullYear());

  const scenarios = [
    { label: 'Current Rate (live)', rate: fx.rate },
    { label: 'Alert Rate ฿31.0', rate: 31.0 },
    { label: 'Risk Scenario ฿29.0', rate: 29.0 }
  ].map(s => {
    if (!s.rate) return Object.assign({}, s, { currentTHB: null, projectedTHB: null });
    const currentTHB = currentValueUSD * s.rate;
    const projectedTHB = monthsToTarget > 0 && r > 0 ? currentTHB * growthFactor + pmtNow * ((growthFactor - 1) / r) : currentTHB;
    return Object.assign({}, s, { currentTHB, projectedTHB });
  });

  const headwind = (scenarios[0].projectedTHB !== null && scenarios[2].projectedTHB !== null)
    ? scenarios[0].projectedTHB - scenarios[2].projectedTHB : null;

  return `
  <div class="table-wrap">
    <table>
      <thead><tr><th>Scenario</th><th>Rate</th><th>Current ฿ Value</th><th>Projected ${targetYear} ฿ (${goodCagr}% CAGR)</th></tr></thead>
      <tbody>
        ${scenarios.map(s => `<tr><td>${esc(s.label)}</td><td>${s.rate ? s.rate.toFixed(2) : '—'}</td><td>${fmtTHB(s.currentTHB)}</td><td>${fmtTHB(s.projectedTHB)}</td></tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div class="metric-sub" style="margin-top:10px;">${headwind !== null ? `FX headwind if THB strengthens to ฿29: −${fmtTHB(headwind)} by ${targetYear}` : 'Live FX rate required to compute headwind estimate.'}</div>
  `;
}

async function fetchHoldingsNews() {
  if (!apiConfig.finnhubKey) return [];
  const to = todayISO();
  const fromDate = new Date(); fromDate.setDate(fromDate.getDate() - 7);
  const from = fromDate.toISOString().slice(0, 10);
  const results = [];
  for (const pos of appData.positions) {
    try {
      const url = `https://finnhub.io/api/v1/company-news?symbol=${encodeURIComponent(pos.ticker)}&from=${from}&to=${to}&token=${encodeURIComponent(apiConfig.finnhubKey)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Finnhub news ' + res.status);
      const data = await res.json();
      if (Array.isArray(data)) {
        data.slice(0, 5).forEach(item => results.push(Object.assign({}, item, { ticker: pos.ticker, tier: pos.tier })));
      }
    } catch (e) { /* skip this ticker silently — one bad symbol shouldn't blank the whole feed */ }
    await sleep(200);
  }
  results.sort((a, b) => (b.datetime || 0) - (a.datetime || 0));
  return results.slice(0, 50);
}

async function fetchMacroNews() {
  if (!apiConfig.finnhubKey) return [];
  try {
    const res = await fetch(`https://finnhub.io/api/v1/news?category=general&token=${encodeURIComponent(apiConfig.finnhubKey)}`);
    if (!res.ok) throw new Error('Finnhub news ' + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data.slice(0, 20) : [];
  } catch (e) {
    return [];
  }
}

async function refreshNewsData() {
  if (!apiConfig.finnhubKey) { toast('Add a Finnhub API key in Settings to enable news', 'error'); return; }
  try {
    const [holdings, macro] = await Promise.all([fetchHoldingsNews(), fetchMacroNews()]);
    newsState.holdings = holdings;
    newsState.macro = macro;
    newsState.lastRefresh = Date.now();
    try { localStorage.setItem(LS_KEYS.cacheNews, JSON.stringify(newsState)); } catch (e) { /* ignore */ }
    renderAll();
  } catch (e) {
    toast('Unable to load news. Check API key or try refreshing.', 'error');
  }
}

function loadNewsCache() {
  try {
    const raw = localStorage.getItem(LS_KEYS.cacheNews);
    if (raw) newsState = Object.assign(newsState, JSON.parse(raw));
  } catch (e) { /* ignore */ }
}

  const summary = (item.summary || '').slice(0, 120);
  return `
  <div class="alert-box" style="display:block;">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
      ${isMacro ? '<span class="badge badge-muted">MACRO</span>' : `<span class="pill pill-${item.tier}">${esc(item.ticker)}</span>`}
      <span class="text-muted" style="font-size:11px;">${dtStr} · ${esc(item.source || '')}</span>

function renderMarketNewsTab() {
  if (!apiConfig.finnhubKey) {
    return `<div class="card placeholder-card"><div class="big">${icon('key', 40)}</div><p>Add Finnhub API key in Settings to enable news</p></div>`;
  }

  const allTickers = appData.positions.map(p => p.ticker);

  const filterButtons = ['all', 'holdings', 'macro', ...allTickers].map(f => {

    return `<button class="btn btn-sm ${newsState.filter === f ? 'btn-primary' : ''}" data-action="filter-news" data-filter="${esc(f)}">${esc(label)}</button>`;
  }).join('');

  const newsSkeleton = '<div class="alert-box" style="display:block;"><span class="skeleton" style="display:block;width:60%;height:10px;margin-bottom:8px;">tt</span><span class="skeleton" style="display:block;width:90%;height:14px;">tt</span></div>'.repeat(3);

  return `
  <div class="card">
    <div class="btn-row" style="margin-top:0;">
      <button class="btn btn-primary" data-action="refresh-news" ${isNewsRefreshing ? 'disabled' : ''}>${isNewsRefreshing ? `<span class="icon-spin">${icon('refresh')}</span> Refreshing…` : `${icon('refresh')} Refresh News`}</button>

    <div class="section-header">Holdings News</div>
    ${isNewsRefreshing ? newsSkeleton : (holdingsShown.length === 0 ? '<div class="metric-sub text-muted">No holdings news loaded yet. Click Refresh News.</div>' : holdingsShown.map(i => newsCardHtml(i, false)).join(''))}
  </div>

  <div class="card">
    <div class="section-header">Market &amp; Macro News</div>
    ${isNewsRefreshing ? newsSkeleton : (macroShown.length === 0 ? '<div class="metric-sub text-muted">No macro news loaded yet. Click Refresh News.</div>' : macroShown.map(i => newsCardHtml(i, true)).join(''))}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; editingLogId = null; }

// Tracks the actionLog entry id currently being edited via the DCA modal, or
// null when the modal is in "add new" mode.
let editingLogId = null;

function openDcaModal(logId, prefill) {
  editingLogId = logId || null;
  const entry = editingLogId ? appData.actionLog.find(e => e.id === editingLogId) : null;
  const tickers = appData.positions.map(p => p.ticker);
  if (entry && !tickers.includes(entry.ticker)) tickers.unshift(entry.ticker);
  const reasons = ['Dip trigger', 'Macro event', 'Fallback', 'Manual', 'Rebalancing trim', 'Rebalancing buy'];
  const prefillReason = prefill ? (prefill.reason || 'Rebalancing buy') : null;
  const prefillVerb = prefillReason === 'Rebalancing trim' ? 'Trim' : prefillReason === 'Rebalancing buy' ? 'Buy' : 'Allocation';
  const title = entry ? 'Edit DCA Entry' : (prefill ? `Log ${prefillVerb}: ${esc(prefill.ticker)}` : 'Log a DCA');
  const queueNote = (!entry && prefill && dcaAllocationQueue.length > 0)
    ? `<div class="metric-sub" style="margin-bottom:10px;">${dcaAllocationQueue.length} more allocation(s) queued after this one.</div>` : '';
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" data-action="modal-overlay-close">
    <div class="modal" data-action="noop">
      <h3>${title}</h3>
      ${queueNote}
      <div class="form-group"><label class="form-label">Date</label>
        <input type="date" class="form-input" id="dca-date" value="${esc(entry ? entry.date : todayISO())}"></div>
      <div class="form-group"><label class="form-label">Ticker</label>
        <select class="form-select" id="dca-ticker">${tickers.map(t => `<option value="${esc(t)}" ${(entry ? entry.ticker === t : (prefill && prefill.ticker === t)) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Shares (+ buy / − sell)</label>
          <input type="number" step="any" class="form-input" id="dca-shares" value="${entry ? entry.shares : (prefill ? Number(prefill.sharesToBuy.toFixed(6)) : 0)}"></div>
        <div class="form-group"><label class="form-label">Price/Share USD</label>
          <input type="number" step="any" class="form-input" id="dca-price" value="${entry ? entry.price : (prefill ? Number(prefill.price.toFixed(4)) : 0)}"></div>
      </div>
      <div class="form-group"><label class="form-label">Total Amount ฿</label>
        <input type="number" step="any" class="form-input" id="dca-thb" value="${entry ? entry.totalTHB : (prefill ? Number(prefill.amountTHB.toFixed(2)) : 0)}"></div>
      <div class="form-group"><label class="form-label">Trigger Reason</label>
        <select class="form-select" id="dca-reason">${reasons.map(r => `<option value="${esc(r)}" ${(entry ? entry.reason === r : (prefill && r === prefillReason)) ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Notes (optional)</label>
        <textarea class="form-textarea" id="dca-notes">${esc(entry && entry.notes ? entry.notes : '')}</textarea></div>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="confirm-dca">${entry ? 'Save Changes' : 'Confirm'}</button>
        <button class="btn" data-action="modal-overlay-close">Cancel</button>
      </div>
    </div>
  </div>`;

  let thbManuallyEdited = false;
  const sharesEl = document.getElementById('dca-shares');
  const priceEl = document.getElementById('dca-price');
  const thbEl = document.getElementById('dca-thb');
  function recalcThb() {
    if (thbManuallyEdited) return;
    const shares = parseFloat(sharesEl.value) || 0;
    const price = parseFloat(priceEl.value) || 0;
    const rate = fx.rate || 0;
    thbEl.value = (shares * price * rate).toFixed(2);
  }
  sharesEl.addEventListener('input', recalcThb);
  priceEl.addEventListener('input', recalcThb);
  thbEl.addEventListener('input', () => { thbManuallyEdited = true; });
}

function confirmDca() {
  const ticker = document.getElementById('dca-ticker').value;
  const date = document.getElementById('dca-date').value;
  const shares = parseFloat(document.getElementById('dca-shares').value) || 0;
  const price = parseFloat(document.getElementById('dca-price').value) || 0;
  const totalTHB = parseFloat(document.getElementById('dca-thb').value) || 0;
  const reason = document.getElementById('dca-reason').value;
  const notes = document.getElementById('dca-notes').value;

  const pos = appData.positions.find(p => p.ticker === ticker);
  if (!pos) { toast('Position not found — add it in Portfolio tab first', 'error'); return; }

  if (editingLogId) {
    const entry = appData.actionLog.find(e => e.id === editingLogId);
    if (entry) Object.assign(entry, { date, ticker, shares, price, totalTHB, reason, notes });
  } else {
    appData.actionLog.push({ id: genId(), date, ticker, shares, price, totalTHB, reason, notes, timestamp: Date.now() });
  }
  recomputeAllPositionsFromLog();
  persistDataCache();
  debouncedSaveToGist();
  const wasEditing = !!editingLogId;
  closeModal();
  toast(wasEditing ? 'DCA entry updated' : 'DCA logged', 'success');
  if (dcaAllocationQueue.length > 0) {
    const next = dcaAllocationQueue.shift();
    openDcaModal(null, next);
  } else {
    renderAll();
  }
}

function deleteDcaLogEntry(id) {
  if (!confirm('Delete this DCA log entry? The affected position\'s shares and avg cost will be recalculated.')) return;
  appData.actionLog = appData.actionLog.filter(e => e.id !== id);
  recomputeAllPositionsFromLog();
  persistDataCache();
  debouncedSaveToGist();
  renderAll();
  toast('Log entry deleted', 'success');
}

async function confirmAddPosition() {
  const ticker = document.getElementById('add-ticker').value.trim().toUpperCase();
  if (!ticker) { toast('Ticker required', 'error'); return; }
  if (appData.positions.some(p => p.ticker === ticker)) { toast('Position already exists', 'error'); return; }
  const tier = document.getElementById('add-tier').value;
  const shares = parseFloat(document.getElementById('add-shares').value) || 0;
  const avgCost = parseFloat(document.getElementById('add-avgcost').value) || 0;
  const targetWeight = parseFloat(document.getElementById('add-target').value) || 0;
  appData.positions.push({ ticker, tier, shares, avgCost, targetWeight, baseShares: shares, baseAvgCost: avgCost });
  persistDataCache();
  debouncedSaveToGist();
  closeModal();
  renderAll();
  try {
    const q = await fetchQuote(ticker);
    if (q) {
      prices[ticker] = { price: q.c, prevClose: q.pc, dayChangeAbs: q.c - q.pc, dayChangePct: q.pc ? ((q.c - q.pc) / q.pc) * 100 : 0, ts: Date.now(), cached: false };
      persistPricesCache();
    }
  } catch (e) { /* price fetch best-effort */ }
  renderAll();
  toast('Position added', 'success');
}

function confirmEditPosition(originalTicker) {
  const pos = appData.positions.find(p => p.ticker === originalTicker);
  if (!pos) { toast('Position not found', 'error'); return; }

  const newTicker = document.getElementById('edit-pos-ticker').value.trim().toUpperCase();
  const tier = document.getElementById('edit-pos-tier').value;
  const shares = parseFloat(document.getElementById('edit-pos-shares').value) || 0;
  const avgCost = parseFloat(document.getElementById('edit-pos-avgcost').value) || 0;
  const targetWeight = parseFloat(document.getElementById('edit-pos-target').value) || 0;

  if (!newTicker) { toast('Ticker required', 'error'); return; }
  if (newTicker !== originalTicker && appData.positions.some(p => p.ticker === newTicker)) {
    toast('A position with that ticker already exists', 'error');
    return;
  }

  if (newTicker !== originalTicker) {
    // Keep the action log (and hence derived shares/avg cost) attached to
    // the renamed position instead of orphaning its history.
    appData.actionLog.forEach(e => { if (e.ticker === originalTicker) e.ticker = newTicker; });
    if (prices[originalTicker]) {
      prices[newTicker] = prices[originalTicker];
      delete prices[originalTicker];
      persistPricesCache();
    }
  }

  pos.ticker = newTicker;
  pos.tier = tier;
  pos.baseShares = shares;
  pos.baseAvgCost = avgCost;
  pos.targetWeight = targetWeight;
  recomputeAllPositionsFromLog();
  persistDataCache();
  debouncedSaveToGist();
  closeModal();
  renderAll();
  toast('Position updated', 'success');
}
